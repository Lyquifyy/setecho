# Fly.io config for the Setecho API (app setecho-api, org zander-erwin, region dfw).
# Deploy from backend/ with `fly deploy`. The key is a Fly secret: `fly secrets set MODEL_API_KEY=...`
# App URL: https://setecho-api.fly.dev  (SETECHO_API_BASE in ios/Config/Local.xcconfig)

app = 'setecho-api'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
