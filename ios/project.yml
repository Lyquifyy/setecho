name: Setecho
options:
  bundleIdPrefix: com.getsetecho
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  # Garmin's Connect IQ companion SDK: device selection through Garmin Connect, messages to the watch app.
  ConnectIQ:
    url: https://github.com/garmin/connectiq-companion-app-sdk-ios
    branch: main
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Setecho:
    type: application
    platform: iOS
    sources:
      - Setecho
      # Temporary until M6: the M0 gate probes ship inside the app, behind the More menu.
      - path: Probes
        excludes: [ProbesApp.swift, Info.plist, Probes.entitlements, README.md]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getsetecho.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Setecho
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Setecho films your sets and takes your check-in photos."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Setecho listens for your voice commands and check-in answers during hands-free sessions."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Import a program or check-in form from a screenshot."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Setecho reads your weight, nutrition, steps and sleep to fill in your coach's check-in."
        # Required by App Store validation whenever the HealthKit entitlement is present. Setecho never writes.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Setecho never writes to Health. This permission is not used."
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        # Only HTTPS through Apple's networking: exempt from export compliance, so TestFlight skips the question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Setecho.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The Connect IQ SDK is Objective-C with categories; it needs -ObjC to link.
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Setecho talks to your Garmin watch through Garmin Connect."
    dependencies:
      - target: SetechoShare
        embed: true
      - package: ConnectIQ
  # WhatsApp → Share → Setecho: hands the coach's text or voice note to the app through the app group.
  SetechoShare:
    type: app-extension
    platform: iOS
    sources: [SetechoShare]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getsetecho.app.share
        # Generated keys (identifier, executable, version) plus the NSExtension block from the file.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Setecho
        INFOPLIST_FILE: SetechoShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: SetechoShare/SetechoShare.entitlements
        SKIP_INSTALL: YES
  SetechoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SetechoTests
      # The rep-count series shared with the backend: RepCounter must count them like reps.py does.
      - path: ../backend/tests/fixtures/reps
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Setecho
  # Throwaway M0 gate probes (audio, Health, share). Shares the design system; ships nothing.
  Probes:
    type: application
    platform: iOS
    sources:
      - Probes
      - path: Setecho/DesignSystem
      - path: Setecho/Assets.xcassets
      - path: Setecho/Services/WAVFile.swift
      - path: Setecho/Services/AudioCapture.swift
      - path: Setecho/App/AppRouter.swift
      - path: Setecho/Services/WatchService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getsetecho.probes
        INFOPLIST_FILE: Probes/Info.plist
        CODE_SIGN_ENTITLEMENTS: Probes/Probes.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    dependencies:
      - package: ConnectIQ
schemes:
  Setecho:
    build:
      targets:
        Setecho: all
        SetechoTests: [test]
    test:
      targets: [SetechoTests]
  Probes:
    build:
      targets:
        Probes: all
