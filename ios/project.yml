name: Setecho
options:
  bundleIdPrefix: com.getsetecho
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Setecho:
    type: application
    platform: iOS
    sources: [Setecho]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getsetecho.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Setecho
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Setecho films your sets to measure bar speed and bar path."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Setecho records what you say after a set so it can log your RPE and notes."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Import program photos and set videos."
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SetechoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SetechoTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Setecho
schemes:
  Setecho:
    build:
      targets:
        Setecho: all
        SetechoTests: [test]
    test:
      targets: [SetechoTests]
